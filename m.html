<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>상국포털 390px 미리보기(임시)</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<style>
  html,body{margin:0;padding:0;background:#0f172a;}
  .ph{width:390px;height:880px;margin:24px auto;background:#fff;overflow:hidden;border-radius:26px;
      box-shadow:0 12px 48px rgba(0,0,0,.55);position:relative;}
  iframe{width:390px;height:3600px;border:0;display:block;position:absolute;top:0;left:0;}
  .cap{color:#94a3b8;font:700 12px -apple-system,"Apple SD Gothic Neo",sans-serif;text-align:center;margin:14px 0 0;}
</style>
</head>
<body>
<div class="cap">상국포털 · 390px 모바일 렌더 확인용(임시) · V39 출근 배너</div>
<div class="ph"><iframe id="fr" src="./index.html?preview=390v39" title="상국포털 390px 미리보기"></iframe></div>
<script>
  var fr = document.getElementById('fr');
  fr.addEventListener('load', function () {
    setTimeout(function () {
      try {
        var w = fr.contentWindow, d = fr.contentDocument;
        w.scrollTo(0, 0);
        var el = d.getElementById('sgCommuteBanner');
        if (el) {
          var y = el.getBoundingClientRect().top + w.scrollY - 12;
          fr.style.top = (-y) + 'px';
        }
      } catch (e) {}
    }, 2500);
  });
</script>
</body>
</html>
