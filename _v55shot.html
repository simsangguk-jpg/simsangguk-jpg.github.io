<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>V55 화면 검증</title>
<style>
  html,body{margin:0;padding:0;background:#dfe4ea;}
  iframe{border:0;display:block;background:#fff;box-shadow:0 0 0 1px #c7ced8;}
</style>
</head>
<body>
<iframe id="ff" src="./?v=55shot&cb=x" title="상국포털"></iframe>
<script>
  var q = new URLSearchParams(location.search);
  var w = parseInt(q.get('w') || '1440', 10), h = parseInt(q.get('h') || '900', 10);
  var sel = q.get('el') || '', off = parseInt(q.get('off') || '104', 10);
  var f = document.getElementById('ff');
try { f.src = './?v=55shot&cb=' + Date.now(); } catch (e) {}
  f.style.width = w + 'px';
  f.style.height = h + 'px';
  var tries = 0;
  function place() {
    tries++;
    var win, doc;
    try { win = f.contentWindow; doc = f.contentDocument; } catch (e) { return; }
    if (!win || !doc) return;
    var t = sel ? doc.getElementById(sel) : null;
    if (t) {
      var y = t.getBoundingClientRect().top + (win.scrollY || win.pageYOffset || 0) - off;
      win.scrollTo(0, Math.max(0, y));
      return;
    }
    if (tries < 40) setTimeout(place, 400);
  }
  f.addEventListener('load', function () { setTimeout(place, 400); });
  setTimeout(place, 1200);
</script>
</body>
</html>
