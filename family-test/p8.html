<!doctype html><html lang="ko"><head><meta charset="utf-8">
<title>모바일 390px 세로 긴 미리보기 (V11 하네스)</title>
<style>body{margin:0;background:#DDE3E8;display:flex;align-items:flex-start;justify-content:center;font-family:-apple-system,sans-serif}
.phone{width:390px;height:3000px;background:#fff;border:1px solid #C9D2D9;position:relative}
.phone iframe{width:100%;height:100%;border:0;display:block}</style></head>
<body><div class="phone"><iframe src="./index.html?harness=1"></iframe></div>
<script>
var f = document.querySelector('iframe');
f.addEventListener('load', function () {

});
</script></body></html>
