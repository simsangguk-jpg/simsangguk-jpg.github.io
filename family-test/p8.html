<!doctype html><html lang="ko"><head><meta charset="utf-8">
<title>모바일 390px 세로 긴 미리보기</title>
<style>body{margin:0;background:#DDE3E8;display:flex;align-items:flex-start;justify-content:center;font-family:-apple-system,sans-serif}
.phone{width:390px;height:2900px;background:#fff;border:1px solid #C9D2D9;position:relative}
.phone iframe{width:100%;height:100%;border:0;display:block}</style></head>
<body><div class="phone"><iframe src="./index.html?m=1"></iframe></div>
<script>
/* 긴 세로 캡처용: 화면에 고정되는 하단 탭과 + 버튼이 긴 뷰포트 아래에 붙어 내용을 가리므로 숨긴다 */
var f = document.querySelector('iframe');
f.addEventListener('load', function () {
  try { f.contentDocument.head.insertAdjacentHTML('beforeend', '<style>#tabbar,#v4Fab{display:none !important}</style>'); } catch (e) {}
});
</script></body></html>
