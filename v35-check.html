<!doctype html><html lang="ko"><head><meta charset="utf-8">
<title>상국포털 V35 검증(임시)</title>
<meta name="robots" content="noindex">
<style>
  html,body{margin:0;background:#dfe5ea;font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic",sans-serif}
  body{display:flex;align-items:flex-start;justify-content:center;padding:16px 0}
  .phone{width:414px;height:860px;border-radius:34px;overflow:hidden;background:#fff;border:8px solid #14181d;box-shadow:0 20px 50px rgba(20,24,29,.28);position:relative}
  .phone iframe{width:100%;height:100%;border:0;display:block}
  .wide{width:1280px;height:900px;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 18px 44px rgba(20,24,29,.22)}
  .wide iframe{width:100%;height:100%;border:0;display:block}
</style></head>
<body>
<div id="host" class="phone"><iframe id="fr"></iframe></div>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var mode = q.get('w') || 'phone';
  var lat = q.get('lat'), lon = q.get('lon');
  var host = document.getElementById('host');
  var fr = document.getElementById('fr');
  if (mode === 'wide') host.className = 'wide';
  fr.src = './index.html?m=' + Date.now();
  var fired = false, tries = 0;
  var timer = setInterval(function () {
    tries++;
    try {
      var W = fr.contentWindow, d = W.document;
      if (lat && lon && W._sgNearAt && !fired) {
        fired = true;
        W._sgNearAt(parseFloat(lat), parseFloat(lon), true);
      }
      var el = d.getElementById('sgTravelMapCard');
      if (el) {
        var top = el.getBoundingClientRect().top + W.scrollY - 8;
        W.scrollTo(0, Math.max(0, top));
      }
    } catch (e) {}
    if (tries > 90) clearInterval(timer);
  }, 400);
})();
</script>
</body></html>
