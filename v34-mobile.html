<!doctype html><html lang="ko"><head><meta charset="utf-8">
<title>상국포털 V34 모바일 미리보기</title>
<meta name="robots" content="noindex">
<style>
  html,body{margin:0;background:#dfe5ea;font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic",sans-serif}
  body{display:flex;align-items:flex-start;justify-content:center;padding:16px 0}
  .phone{width:414px;height:860px;border-radius:34px;overflow:hidden;background:#fff;border:8px solid #14181d;box-shadow:0 20px 50px rgba(20,24,29,.28);position:relative}
  .phone iframe{width:100%;height:100%;border:0;display:block}
</style></head>
<body>
<div class="phone"><iframe id="fr"></iframe></div>
<script>
  (function () {
    var target = new URLSearchParams(location.search).get('t') || 'sgTravelMapCard';
    var fr = document.getElementById('fr');
    fr.src = './index.html?m=' + Date.now();
    fr.addEventListener('load', function () {
      var tries = 0;
      var timer = setInterval(function () {
        tries++;
        try {
          var d = fr.contentWindow.document;
          var el = d.getElementById(target);
          if (el) {
            var top = el.getBoundingClientRect().top + fr.contentWindow.scrollY - 8;
            fr.contentWindow.scrollTo(0, Math.max(0, top));
            clearInterval(timer);
            return;
          }
        } catch (e) {}
        if (tries > 40) clearInterval(timer);
      }, 250);
    });
  })();
</script>
</body></html>
