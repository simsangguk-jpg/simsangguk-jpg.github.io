<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0A0B0E">
  <title>상국포털 위젯</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <style>
    /* ==========================================================================
       상국포털 위젯 · 한 화면 컴팩트 (2026-11-23)
       - 바탕화면 위젯 한 프레임(약 500×520 / 380×500)에 스크롤·잘림 없이
        ① 오늘 근무 며칠차  ② 오늘 날씨  ③ 이번 달 월력표 달력
       - 테마: 사이버캡 다크·골드 (#0A0B0E / #13161C / #1B1F27 / #D4AF37 · #E5C158)
       - 개인정보 없음(실명·주소·계정잔액·수익 금액 없음) · noindex 유지
       ========================================================================== */
    :root{
      color-scheme: dark;
      --bg:#0A0B0E; --surf:#13161C; --surf2:#1B1F27; --surf3:#23272F;
      --gold:#D4AF37; --gold2:#E5C158; --gold-d:#9C7C22;
      --ink:#F5F6F8; --ink2:#C9D0DC; --ink3:#8C96A8;
      --line:rgba(255,255,255,.08); --line-g:rgba(212,175,55,.26);
      --work-bg:rgba(248,113,113,.10); --work-ln:rgba(248,113,113,.24); --work-tx:#FCA5A5;
      --rest-bg:rgba(52,211,153,.09);  --rest-ln:rgba(52,211,153,.22);  --rest-tx:#6EE7B7;
    }
    *{ box-sizing:border-box; margin:0; padding:0; }
    html,body{ height:100%; }
    html{ -webkit-text-size-adjust:100%; }
    body{
      font-family:'Pretendard Variable',Pretendard,'Inter',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;
      background:var(--bg); color:var(--ink);
      letter-spacing:-.01em; -webkit-font-smoothing:antialiased;
      font-feature-settings:'tnum' 1;
      overflow:hidden;
    }
    a{ text-decoration:none; color:inherit; -webkit-tap-highlight-color:transparent; }

    /* 위젯 앱 자체 오버레이를 피하면서 달력 칸 높이를 최대한 확보 */
    .w{
      height:100%;
      display:flex; flex-direction:column; gap:4px;
      padding:24px 8px 6px;
      max-width:560px; margin:0 auto;
    }

    /* ── 헤더 ───────────────────────────────────────────── */
    .w-head{ display:flex; align-items:center; justify-content:space-between; gap:8px; flex:0 0 auto; padding:0 2px; }
    .w-brand{ display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:700; color:var(--ink2); letter-spacing:-.01em; }
    .w-brand::before{ content:''; width:3px; height:11px; border-radius:2px; background:linear-gradient(180deg,var(--gold2),var(--gold-d)); }
    .w-date{ font-size:11px; font-weight:600; color:var(--ink3); font-variant-numeric:tabular-nums; white-space:nowrap; }

    /* ── 공통 카드 ──────────────────────────────────────── */
    .card{ background:var(--surf); border:1px solid var(--line); border-radius:12px; padding:6px 9px; flex:0 0 auto; }
    .hd{ display:flex; align-items:center; justify-content:space-between; gap:6px; margin-bottom:4px; }
    .hd-t{ font-size:12px; font-weight:700; color:var(--ink); letter-spacing:-.01em; }
    .pill{
      flex:0 0 auto; font-size:10.5px; font-weight:700; color:var(--gold2);
      background:rgba(212,175,55,.10); border:1px solid var(--line-g); border-radius:999px;
      padding:1px 6px; white-space:nowrap; font-variant-numeric:tabular-nums;
    }

    /* ── ① 오늘 근무 ─────────────────────────────────────── */
    .sh{
      background:linear-gradient(180deg,rgba(212,175,55,.07) 0%,rgba(212,175,55,.015) 60%,rgba(212,175,55,0) 100%),var(--surf);
      border:1px solid rgba(212,175,55,.22); border-radius:12px; padding:6px 9px;
      flex:0 0 auto;
    }
    .sh-top{ display:flex; align-items:center; gap:6px; }
    .sh-dot{ flex:0 0 auto; width:7px; height:7px; border-radius:50%; background:var(--gold); box-shadow:0 0 0 3px rgba(212,175,55,.13); }
    .sh.rest .sh-dot{ background:#34D399; box-shadow:0 0 0 3px rgba(52,211,153,.15); }
    .sh.work .sh-dot{ background:#F87171; box-shadow:0 0 0 3px rgba(248,113,113,.15); }
    .sh-main{ font-size:17px; font-weight:800; letter-spacing:-.03em; line-height:1.1; font-variant-numeric:tabular-nums; white-space:nowrap; }
    .sh-main b{ color:var(--gold2); font-weight:800; }
    .sh.rest .sh-main b{ color:var(--rest-tx); }
    .sh.work .sh-main b{ color:var(--work-tx); }
    .sh-pips{ display:inline-flex; align-items:center; gap:3px; margin-left:auto; }
    .sh-pips i{ width:5px; height:5px; border-radius:50%; background:rgba(255,255,255,.14); }
    .sh-pips i.on{ background:var(--gold); }
    .sh.rest .sh-pips i.on{ background:#34D399; }
    .sh.work .sh-pips i.on{ background:#F87171; }
    .sh-sub{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:2px; }
    .sh-sub span{ font-size:11.5px; font-weight:600; color:var(--ink2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .sh-sub em{ font-style:normal; font-size:11px; font-weight:600; color:var(--gold2); white-space:nowrap; }

    /* ── ② 오늘 날씨 ─────────────────────────────────────── */
    .wx-2{ display:grid; grid-template-columns:1fr 1fr; gap:5px; }
    .wx-c{ background:var(--surf2); border:1px solid var(--line); border-radius:9px; padding:4px 7px 5px; min-width:0; }
    .wx-n{ display:flex; align-items:baseline; justify-content:space-between; gap:4px; font-size:11.5px; font-weight:700; color:var(--ink2); }
    .wx-n span{ font-size:10.5px; font-weight:600; color:var(--ink3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .wx-t{ display:flex; align-items:flex-start; gap:1px; font-size:17px; font-weight:800; line-height:1.05; letter-spacing:-.03em; font-variant-numeric:tabular-nums; margin:1px 0 0; }
    .wx-t b{ font-size:17px; font-weight:800; line-height:1.05; }
    .wx-t i{ font-style:normal; font-size:10.5px; font-weight:600; color:var(--ink3); margin-top:3px; }
    .wx-r{ font-size:10.5px; font-weight:600; color:var(--ink3); font-variant-numeric:tabular-nums; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .wx-l{ display:flex; align-items:center; gap:4px; font-size:10.5px; font-weight:500; color:var(--ink2); line-height:1.35; margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .wx-l b{ font-weight:700; color:var(--ink); }
    .wx-l:last-child{ margin-top:1px; }

    /* ── ③ 월력표 달력 ───────────────────────────────────── */
    .cal{ display:flex; flex-direction:column; flex:1 1 auto; min-height:0; }
    .lg{ display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:600; color:var(--ink3); white-space:nowrap; }
    .lg i{ width:7px; height:7px; border-radius:2px; display:inline-block; }
    .lg i.work{ background:rgba(248,113,113,.55); }
    .lg i.rest{ background:rgba(52,211,153,.55); margin-left:5px; }
    .dow{ display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:3px; flex:0 0 auto; margin-bottom:3px; }
    .dow span{ text-align:center; font-size:11px; font-weight:700; color:var(--ink3); }
    .dow span:first-child{ color:#E08A8A; }
    .dow span:last-child{ color:#8AB4E0; }
    .grid{ display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); grid-auto-rows:minmax(0,1fr); gap:3px; flex:1 1 auto; min-height:0; }
    .cc{
      position:relative; min-height:0; min-width:0; overflow:hidden;
      display:flex; flex-direction:column; align-items:stretch; justify-content:flex-start;
      border-radius:6px; border:1px solid transparent; background:transparent;
      padding:2px 3px; line-height:1.1; gap:2px;
    }
    .cc.work{ background:var(--work-bg); border-color:var(--work-ln); }
    .cc.rest{ background:var(--rest-bg); border-color:var(--rest-ln); }
    .cc.vac{ background:rgba(167,139,250,.12); border-color:rgba(167,139,250,.32); }
    .cc .cc-d{ font-size:11px; font-weight:800; color:var(--ink); font-variant-numeric:tabular-nums; line-height:1; white-space:nowrap; flex:0 0 auto; }
    .cc.work .cc-d{ color:#FFE4E6; }
    .cc.rest .cc-d{ color:#D1FAE5; }
    .cc.vac .cc-d{ color:#EDE9FE; }
    .cc.dim .cc-d{ color:rgba(140,150,168,.45); }
    .cc.sun:not(.work):not(.rest):not(.vac) .cc-d{ color:#E0A0A0; }
    .cc.sat:not(.work):not(.rest):not(.vac) .cc-d{ color:#9AB8DE; }
    .cc-top{ display:flex; align-items:center; justify-content:center; gap:2px; width:100%; flex:0 0 auto; }
    .cc .cc-d{ font-size:11.5px; font-weight:800; color:var(--ink); font-variant-numeric:tabular-nums; line-height:1.2; white-space:nowrap; }
    .cc.today .cc-d{
      background:var(--gold); color:#0A0B0E; font-weight:900; border-radius:999px;
      padding:0 5px; min-width:17px; text-align:center;
    }
    .cc-bar{
      width:100%; height:auto !important; text-align:center; font-size:9.5px; font-weight:800; line-height:1.38;
      border-radius:3px; padding:1.5px 0 !important; margin:0; white-space:nowrap; overflow:hidden; flex:0 0 auto;
    }
    .cc-bar.wk{ background:rgba(220,38,38,.82); color:#FFFFFF; }
    .cc-bar.rs{ background:rgba(16,185,129,.76); color:#FFFFFF; }
    .cc-bar.vc{ background:rgba(139,92,246,.85); color:#FFFFFF; }
    .cc-wx{ font-size:9px; line-height:1; }
    .cc .cc-l{
      font-size:9px; font-weight:700; color:#F3F4F6; width:100%;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
      letter-spacing:-.04em; text-align:center; line-height:1.25; display:block;
    }
    .cc.today{
      background:rgba(212,175,55,.15); border:1.5px solid var(--gold);
      box-shadow:0 0 0 1px rgba(212,175,55,.22) inset;
    }
    .cc .cc-b{
      flex:0 0 auto; font-size:7.5px; font-weight:800; line-height:1.2; color:#0A0B0E;
      background:var(--gold); border-radius:999px; padding:0 3px;
      font-variant-numeric:tabular-nums; letter-spacing:-.04em;
    }

    /* ── 하단 포털 링크 ──────────────────────────────────── */
    .all{ flex:0 0 auto; display:flex; align-items:center; justify-content:center; gap:5px;
      font-size:11px; font-weight:600; color:var(--ink3); padding:1px 0 0; }
    .all b{ color:var(--ink2); font-weight:700; }
    .all:active{ color:var(--gold2); }

    /* 6주짜리 달(예: 2027년 1월) — 한 화면 유지를 위해 조금 더 압축 */
    body.m6 .w{ padding-top:40px; gap:5px; }
    body.m6 .sh{ padding:6px 9px; }
    body.m6 .sh-sub{ margin-top:2px; }
    body.m6 .card{ padding:7px 9px; }
    body.m6 .dow span{ font-size:10px; }
    body.m6 .grid{ gap:2px; }
    body.m6 .cc-d{ font-size:10px; }
    body.m6 .cc-l{ font-size:8px; }
    body.m6 .cc .cc-b{ font-size:7.5px; padding:0 2px; }
    body.m6 .cc-top{ gap:1px; }

    /* 좁은 폭(360~420) 압축 */
    @media (max-width:430px){
      .w{ padding:26px 8px 6px; gap:4px; }
      .sh-main{ font-size:16px; }
      .wx-c{ padding:4px 6px 4px; }
      .cc{ padding:1.5px 2px; gap:1.5px; }
      .cc .cc-d{ font-size:10px; }
      .cc-st{ font-size:8px; padding:1px 2.5px; }
      .cc .cc-l{ font-size:8px; }
    }
    @media (max-height:470px){
      .w{ padding-top:30px; gap:4px; }
      .sh-main{ font-size:16px; }
      .wx-t, .wx-t b{ font-size:16px; }
    }
  </style>
</head>
<body>
  <div class="w">
    <div class="w-head">
      <span class="w-brand">상국포털</span>
      <span class="w-date" id="wDate">11/23(월)</span>
    </div>

    <!-- ① 오늘 근무 며칠차 -->
    <section class="sh" id="wShift">
      <div class="sh-top">
        <span class="sh-dot"></span>
        <span class="sh-main" id="shMain">휴식 <b>4/5</b>일차</span>

      <div class="sh-sub">
        <span id="shNext">다음 출근 11/25(수) 08:00</span>

    <section class="card cal">
      <div class="hd">
        <span class="hd-t" id="calTitle">2026년 11월</span>
        <span class="lg"><i class="work"></i>근무<i class="rest"></i>휴식</span>
      </div>
      <div class="dow"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
      <div class="grid" id="calGrid"></div>
    </section>

    <a class="all" href="https://simsangguk-jpg.github.io/"><span>🔐</span><b>포털 전체 열기</b></a>
  </div>

  <script>

  <script>
  (function () {
    var $ = function (id) { return document.getElementById(id); };
    var DAYS = ['일', '월', '화', '수', '목', '금', '토'];

    function pad(n) { return (n < 10 ? '0' : '') + n; }
    function dkey(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
    function md(d) { return (d.getMonth() + 1) + '/' + d.getDate(); }

    /* ── 교대근무: 포털 getShiftState 와 같은 규칙 (28일=4주 주기, 기준 2026-11-16) ── */
    var SHIFT_ANCHOR = new Date(2026, 10, 16);
    var OV_KEY = 'sg_shift_overrides_v1';

    function baseState(dateObj) {
      var d = new Date(dateObj.getFullYear(), dateObj.getMonth(), dateObj.getDate());
      var diff = Math.round((d - SHIFT_ANCHOR) / 86400000);
      var idx = ((diff % 28) + 28) % 28;
      if (idx < 4) return { isWork: true, label: '근무', dayInBlock: idx + 1, blockLen: 4 };
      if (idx < 9) return { isWork: false, label: '휴식', dayInBlock: idx - 3, blockLen: 5 };
      if (idx < 14) return { isWork: true, label: '근무', dayInBlock: idx - 8, blockLen: 5 };
      if (idx < 18) return { isWork: false, label: '휴식', dayInBlock: idx - 13, blockLen: 4 };
      if (idx < 23) return { isWork: true, label: '근무', dayInBlock: idx - 17, blockLen: 5 };
      return { isWork: false, label: '휴식', dayInBlock: idx - 22, blockLen: 5 };
    }
    function overrideOf(dateObj) {
      try {
        var o = JSON.parse(localStorage.getItem(OV_KEY) || '{}');
        var v = o && o[dkey(dateObj)];
        if (!v) return null;
        var t = (typeof v === 'string') ? v : v.type;
        return (t === 'work' || t === 'rest' || t === 'vacation') ? t : null;
      } catch (e) { return null; }
    }
    function shiftState(dateObj) {
      var base = baseState(dateObj), ov = overrideOf(dateObj);
      if (!ov) return base;
      if (ov === 'work') return { isWork: true, label: '근무', dayInBlock: base.isWork ? base.dayInBlock : 1, blockLen: base.isWork ? base.blockLen : 0, override: 'work' };
      if (ov === 'rest') return { isWork: false, label: '휴식', dayInBlock: base.isWork ? 1 : base.dayInBlock, blockLen: base.isWork ? 0 : base.blockLen, override: 'rest' };
      return { isWork: false, label: '휴가', dayInBlock: 1, blockLen: 0, override: 'vacation' };
    }
    /* 출근 시각: 월·화 08:30, 수·목·금 08:00 (합수리검문소 기준) */
    function goTime(d) {
      var w = d.getDay();
      if (w === 1 || w === 2) return '08:30';
      if (w >= 3 && w <= 5) return '08:00';
      return '';
    }
    function nextWorkLabel(from) {
      for (var i = 1; i <= 40; i++) {
        var d = new Date(from.getFullYear(), from.getMonth(), from.getDate() + i);
        var st = shiftState(d);
        if (st.isWork) return md(d) + '(' + DAYS[d.getDay()] + ')' + (goTime(d) ? ' ' + goTime(d) : '');
      }
      return '—';
    }
    function restDaysLeft(from, st) {
      if (st.isWork) return st.blockLen ? (st.blockLen - st.dayInBlock) : 0;
      return 0;
    }

    function renderShift() {
      var now = new Date();
      var st = shiftState(now);
      var box = $('wShift'), main = $('shMain'), pips = $('shPips'), next = $('shNext'), note = $('shNote');

      box.className = 'sh ' + (st.isWork ? 'work' : (st.override === 'vacation' ? '' : 'rest'));

      if (st.override === 'vacation') {
        main.innerHTML = '오늘 <b>휴가</b>';
      } else {
        main.innerHTML = '오늘 <b>' + st.label + '</b> · ' + st.dayInBlock + '/' + (st.blockLen || 5) + '일차';
      }

      var n = st.blockLen || 0, html = '';
      for (var i = 1; i <= n; i++) html += '<i class="' + (i <= st.dayInBlock ? 'on' : '') + '"></i>';
      pips.innerHTML = html;

      if (st.isWork) {
        var t = goTime(now);
        next.textContent = '오늘 ' + (t ? t + ' 출근' : '출근') + ' · 휴식까지 ' + Math.max(1, n - st.dayInBlock + 1) + '일';
        note.textContent = '';
      } else {
        next.textContent = '다음 출근 ' + nextWorkLabel(now);
        note.textContent = '';
      }

      /* 오늘 일정이 있으면 오른쪽에 짧게 */
      var ev = (window.SG_WIDGET_EVENTS || {})[dkey(now)];
      if (ev && ev.length) note.textContent = '📌 ' + ev[0].l + (ev.length > 1 ? ' +' + (ev.length - 1) : '');
    }

    /* ── 월력표 달력 ─────────────────────────────────── */
    function renderCalendar() {
      var now = new Date();
      var y = now.getFullYear(), m = now.getMonth();
      $('calTitle').textContent = y + '년 ' + (m + 1) + '월';
      document.body.classList.remove('m6');

      var first = new Date(y, m, 1);
      var startPad = first.getDay();
      var lastDate = new Date(y, m + 1, 0).getDate();
      var cells = startPad + lastDate;
      var rows = Math.ceil(cells / 7);

      var evmap = window.SG_WIDGET_EVENTS || {};
      var html = '';

      /* 앞 달 빈칸 */
      for (var i = 0; i < startPad; i++) html += '<div class="cc dim"></div>';

      for (var d = 1; d <= lastDate; d++) {
        var date = new Date(y, m, d);
        var st = shiftState(date);
        var k = dkey(date);
        var cls = 'cc';
        if (st.override === 'vacation') cls += ' vac';
        else if (st.isWork) cls += ' work';
        else cls += ' rest';
        var wd = date.getDay();
        if (wd === 0) cls += ' sun';
        if (wd === 6) cls += ' sat';
        var isToday = (d === now.getDate());
        if (isToday) cls += ' today';

        var stCls = st.override === 'vacation' ? 'vc' : (st.isWork ? 'wk' : 'rs');
        var stWord = st.override === 'vacation' ? '휴가' : (st.isWork ? '근무' : '휴식');
        var stBar = '<div class="cc-bar ' + stCls + '">' + stWord + '</div>';

        var wxIco = (WX_CAL[k] || '');
        var label = '';
        var ev = evmap[k];
        if (ev && ev.length) {
          var sorted = ev.slice().sort(function (a, b) { return (b.p || 0) - (a.p || 0); });
          for (var j = 0; j < Math.min(2, sorted.length); j++) {
            label += '<span class="cc-l">' + sorted[j].l + '</span>';
          }
        }

        html += '<div class="' + cls + '" data-d="' + k + '">' +
                  '<div class="cc-top"><span class="cc-d">' + d + '</span>' + (wxIco ? '<span class="cc-wx">' + wxIco + '</span>' : '') + '</div>' +
                  stBar + label + '</div>';
      }

      /* 뒷 달 빈칸 */
      var tail = rows * 7 - cells;
      for (var t = 0; t < tail; t++) html += '<div class="cc dim"></div>';

      $('calGrid').innerHTML = html;
      if (rows >= 6) document.body.classList.add('m6');
    }

    /* ── 날씨 (실시간 Open-Meteo · 실패 시 아침 스냅샷 유지) ── */
    var WX = [
      { key: 'pa', lat: 37.7599, lon: 126.7801 },
      { key: 'yc', lat: 38.0966, lon: 127.0749 }
    ];
    var SNAP = window.SG_WIDGET_SNAP || { at: '', pa: {}, yc: {} };

    function sky(code) {
      if (code === 0) return '맑음';
      if (code === 1) return '대체로 맑음';
      if (code === 2) return '구름조금';
      if (code === 3) return '흐림';
      if (code === 45 || code === 48) return '안개';
      if (code >= 51 && code <= 57) return '이슬비';
      if (code >= 61 && code <= 67) return '비';
      if (code >= 71 && code <= 77) return '눈';
      if (code >= 80 && code <= 82) return '소나기';
      if (code >= 85 && code <= 86) return '눈';
      if (code >= 95) return '뇌우';
      return '';
    }
    function pmGrade(kind, v) {
      if (v === null || v === undefined) return '';
      if (kind === 'pm10') {
        if (v <= 30) return '좋음'; if (v <= 80) return '보통'; if (v <= 150) return '나쁨'; return '매우나쁨';
      }
      if (v <= 15) return '좋음'; if (v <= 35) return '보통'; if (v <= 75) return '나쁨'; return '매우나쁨';
    }

    function paintSnap() {
      WX.forEach(function (w) {
        var s = SNAP[w.key] || {};
        if (s.t !== undefined) $(w.key + 'T').textContent = s.t;
        if (s.sky) $(w.key + 'Sky').textContent = s.sky;
        if (s.lo !== undefined && s.hi !== undefined) {
          $(w.key + 'Range').textContent = s.lo + ' ~ ' + s.hi + '℃' + (s.f !== undefined ? ' · 체감 ' + s.f + '℃' : '');
        }
      });
      var pa = SNAP.pa || {}, yc = SNAP.yc || {};
      var rain = Math.max(pa.rain || 0, yc.rain || 0);
      var snow = !!(pa.sky && pa.sky.indexOf('눈') >= 0);
      $('wxRain').innerHTML = (snow ? '❄️ 눈·비 ' : '☔ 비 올 확률 ') + '<b>' + rain + '%</b>' +
        ' · 습도 ' + (pa.hum || '-') + '%';
      var worst = pa.pm25g || pa.pm10g || '';
      var txt = '🍃 미세먼지 <b>' + (worst || '—') + '</b>';
      if (pa.pm10 !== undefined) txt += ' · PM10 ' + pa.pm10;
      if (pa.pm25 !== undefined && pa.pm25 !== null) txt += ' · PM2.5 ' + pa.pm25;
      $('wxPm').innerHTML = txt;
      $('wxStamp').textContent = SNAP.at ? SNAP.at.slice(11, 16) + ' 기준' : '아침 기준';
    }

    function getJSON(url) {
      return new Promise(function (resolve, reject) {
        var ctl = window.AbortController ? new AbortController() : null;
        var timer = setTimeout(function () { if (ctl) ctl.abort(); reject(new Error('timeout')); }, 6000);
        fetch(url, ctl ? { signal: ctl.signal, cache: 'no-store' } : { cache: 'no-store' })
          .then(function (r) { clearTimeout(timer); if (!r.ok) throw new Error('http ' + r.status); return r.json(); })
          .then(resolve).catch(function (e) { clearTimeout(timer); reject(e); });
      });
    }

    var LIVE = { pa: {}, yc: {} };
    var WX_CAL = {};
    function wxEmoji(c) {
      c = Number(c);
      if (c === 0) return '☀️';
      if (c === 1) return '🌤️';
      if (c === 2) return '⛅';
      if (c === 3) return '☁️';
      if (c === 45 || c === 48) return '🌫️';
      if (c >= 51 && c <= 57) return '🌦️';
      if ((c >= 61 && c <= 67) || (c >= 80 && c <= 82)) return '🌧️';
      if ((c >= 71 && c <= 77) || c === 85 || c === 86) return '❄️';
      if (c >= 95) return '⛈️';
      return '⛅';
    }

    function refreshWeather() {
      var lat = WX.map(function (w) { return w.lat; }).join(',');
      var lon = WX.map(function (w) { return w.lon; }).join(',');
      getJSON('https://api.open-meteo.com/v1/forecast?latitude=' + lat + '&longitude=' + lon +
        '&current=temperature_2m,apparent_temperature,weather_code,relative_humidity_2m' +
        '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max' +
        '&timezone=Asia%2FSeoul&forecast_days=14')
        .then(function (res) {
          var list = Array.isArray(res) ? res : [res];
          var at = '';
          list.forEach(function (d, i) {
            var w = WX[i]; if (!w || !d || !d.current) return;
            var c = d.current, day = d.daily || {};
            var t = Math.round(c.temperature_2m), f = Math.round(c.apparent_temperature);
            var lo = day.temperature_2m_min ? Math.round(day.temperature_2m_min[0]) : null;
            var hi = day.temperature_2m_max ? Math.round(day.temperature_2m_max[0]) : null;
            var rain = (day.precipitation_probability_max || [])[0];
            var hum = c.relative_humidity_2m;
            LIVE[w.key] = { t: t, f: f, lo: lo, hi: hi, rain: rain, hum: hum, code: c.weather_code };
            $(w.key + 'T').textContent = t;
            var s = sky(c.weather_code); if (s) $(w.key + 'Sky').textContent = s;
            if (lo !== null && hi !== null) $(w.key + 'Range').textContent = lo + ' ~ ' + hi + '℃ · 체감 ' + f + '℃';
            if (!at && c.time) at = c.time.slice(11, 16);
            if (i === 0 && day.time && day.weather_code) {
              for (var j = 0; j < day.time.length; j++) WX_CAL[day.time[j]] = wxEmoji(day.weather_code[j]);
              renderCalendar();
            }
          });
          if (at) $('wxStamp').textContent = at + ' 실시간';
          paintLiveRain();
        })
        .catch(function () { /* 스냅샷 유지 */ });
    }

    function isSnowCode(c) { return (c >= 71 && c <= 77) || c === 85 || c === 86; }

    function paintLiveRain() {
      var pa = LIVE.pa, yc = LIVE.yc;
      if (pa.t === undefined && yc.t === undefined) return;
      var rain = Math.max(pa.rain || 0, yc.rain || 0);
      var snow = isSnowCode(pa.code) || isSnowCode(yc.code);
      var icon = snow ? '❄️ 눈' : '☔ 비';
      var line;
      if (pa.rain !== undefined && yc.rain !== undefined && pa.rain !== yc.rain) {
        line = icon + ' <b>' + pa.rain + '%·' + yc.rain + '%</b> (파주·연천)';
      } else {
        line = icon + ' 올 확률 <b>' + rain + '%</b>';
      }
      if (pa.hum !== undefined) line += ' · 습도 ' + pa.hum + '%';
      $('wxRain').innerHTML = line;
    }

    function refreshAir() {
      var lat = WX.map(function (w) { return w.lat; }).join(',');
      var lon = WX.map(function (w) { return w.lon; }).join(',');
      getJSON('https://air-quality-api.open-meteo.com/v1/air-quality?latitude=' + lat + '&longitude=' + lon +
        '&current=pm10,pm2_5&timezone=Asia%2FSeoul')
        .then(function (res) {
          var list = Array.isArray(res) ? res : [res];
          var rows = [];
          list.forEach(function (d, i) {
            var w = WX[i]; if (!w || !d || !d.current) return;
            rows.push({ k: w.key, name: (i === 0 ? '파주' : '연천'), pm10: d.current.pm10, pm25: d.current.pm2_5 });
          });
          if (!rows.length) return;
          /* 더 나쁜 쪽을 대표로 */
          rows.sort(function (a, b) { return (b.pm10 || 0) - (a.pm10 || 0); });
          var m = rows[0];
          var g = pmGrade('pm25', m.pm25) || pmGrade('pm10', m.pm10);
          var txt = '🍃 미세먼지 <b>' + (g || '—') + '</b>';
          txt += ' · PM10 ' + Math.round(m.pm10);
          if (m.pm25 !== null && m.pm25 !== undefined) txt += ' · PM2.5 ' + Math.round(m.pm25);
          txt += ' <span style="color:#8C96A8">(' + m.name + ')</span>';
          $('wxPm').innerHTML = txt;
        })
        .catch(function () { /* 스냅샷 유지 */ });
    }

    /* ── 시계·초기화 ─────────────────────────────────── */
    function tickClock() {
      var n = new Date();
      $('wDate').textContent = (n.getMonth() + 1) + '/' + n.getDate() + '(' + DAYS[n.getDay()] + ')';
    }

    tickClock();
    renderShift();
    renderCalendar();

    setInterval(tickClock, 30000);
    setInterval(function () { renderShift(); }, 5 * 60 * 1000);
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden) { tickClock(); renderShift(); renderCalendar(); }
    });
  })();
  </script>
</body>
</html>
