<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>스마트 위젯</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; background: #ffffff; color: #111827; padding: 10px; }
    .w-box { max-width: 480px; margin: 0 auto; }
    .w-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .w-title { font-size: 14px; font-weight: 900; color: #111827; }
    .w-time { font-size: 11px; font-weight: 700; color: #6b7280; }
    .w-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
    .w-tile { background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 12px; padding: 9px 10px; }
    .w-lbl { font-size: 10.5px; font-weight: 800; color: #6b7280; margin-bottom: 3px; }
    .w-val { font-size: 13.5px; font-weight: 800; color: #111827; line-height: 1.25; }
    .w-sub { font-size: 11px; color: #4b5563; margin-top: 2px; line-height: 1.25; }
    .w-full { grid-column: 1 / -1; }
  </style>
</head>
<body>
  <div class="w-box">
    <div class="w-head">
      <div class="w-title">🟢 스마트 홈 위젯</div>
      <div id="wDate" class="w-time"></div>
    </div>
    <div class="w-grid">
      <div id="wShiftTile" class="w-tile">
        <div class="w-lbl">📅 오늘 교대근무</div>
        <div id="wShiftVal" class="w-val">계산 중...</div>
        <div id="wShiftSub" class="w-sub"></div>
      </div>
      <div class="w-tile">
        <div class="w-lbl">🌦️ 파주 날씨</div>
        <div class="w-val">🌧️ 10℃ (99%)</div>
        <div class="w-sub">내일(일) ☀️ 7~16℃ 맑음</div>
      </div>
      <div class="w-tile w-full" style="background:#fef2f2;border-color:#fecaca;">
        <div class="w-lbl" style="color:#dc2626;">⏰ 핵심 D-Day 알림</div>
        <div class="w-val" style="font-size:12px;">• D-1 일요일 11:00 강남 특강 (09:10 출발)</div>
        <div class="w-sub" style="color:#b91c1c;font-weight:700;">• D-2 월요일 15:00 업비트 SOPH·ZIL 거래종료</div>
      </div>
      <div class="w-tile">
        <div class="w-lbl">📈 증시 · 환율</div>
        <div class="w-val" style="font-size:12px;">코스피 5,290.53</div>
        <div class="w-sub">나스닥 25,136 · 1,332원</div>
      </div>
      <div class="w-tile">
        <div class="w-lbl">🪙 비트코인</div>
        <div class="w-val" style="font-size:12px;">$68,801 (▼4.18%)</div>
        <div class="w-sub">업비트 약 9,388만 원</div>
      </div>
      <div class="w-tile w-full">
        <div class="w-lbl">✍️ 최신 발행 콘텐츠</div>
        <div class="w-sub" style="margin-top:0;color:#111827;font-weight:700;">
          • 티스토리 #172 아이패드 미니 A20 프로<br>
          • 네이버 4호 다이소 뽑아쓰는 키친타월
        </div>
      </div>
    </div>
  </div>
  <script>
    const SHIFT_ANCHOR = new Date(2026, 10, 16);
    function getShiftState(d) {
      const t = new Date(d.getFullYear(), d.getMonth(), d.getDate());
      const diff = Math.round((t - SHIFT_ANCHOR) / 86400000);
      const idx = ((diff % 18) + 18) % 18;
      if (idx < 4) return { isWork: true, dayInBlock: idx + 1, blockLen: 4 };
      if (idx < 9) return { isWork: false, dayInBlock: idx - 3, blockLen: 5 };
      if (idx < 14) return { isWork: true, dayInBlock: idx - 8, blockLen: 5 };
      return { isWork: false, dayInBlock: idx - 13, blockLen: 4 };
    }
    const now = new Date();
    const days = ['일','월','화','수','목','금','토'];
    document.getElementById('wDate').textContent = `${now.getMonth()+1}.${now.getDate()}(${days[now.getDay()]})`;
    const st = getShiftState(now);
    let dNext = 1;
    while (getShiftState(new Date(now.getFullYear(), now.getMonth(), now.getDate() + dNext)).isWork === st.isWork && dNext < 18) dNext++;
    const ch = new Date(now.getFullYear(), now.getMonth(), now.getDate() + dNext);
    const tile = document.getElementById('wShiftTile');
    tile.style.background = st.isWork ? '#fef2f2' : '#ecfdf5';
    tile.style.borderColor = st.isWork ? '#fecaca' : '#a7f3d0';
    document.getElementById('wShiftVal').textContent = (st.isWork ? '🔴 근무' : '🟢 휴식') + ` (${st.dayInBlock}/${st.blockLen}일차)`;
    document.getElementById('wShiftSub').textContent = `다음 ${st.isWork ? '휴식' : '출근'}: ${ch.getMonth()+1}/${ch.getDate()}(${days[ch.getDay()]})`;
  </script>
</body>
</html>
